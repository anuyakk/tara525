<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Учёт тары «Деталь Ресурс»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Экран-сканер для телефона и ТСД: одно поле, одна карточка, крупные кнопки, нижнее меню из трёх пунктов */
:root{
  --bg:#f1f3f4; --panel:#ffffff; --ink:#1b2126; --muted:#5f6b74; --line:#d9dfe3;
  --accent:#d9480f; --accent-ink:#ffffff; --steel:#33475a; --steel-ink:#ffffff;
  --ok:#1d7a43; --warn:#9c5f08; --bad:#bb2d22;
  --ok-bg:#e2f2e8; --warn-bg:#fbefd9; --bad-bg:#fbe4e1; --soft:#e8ecef;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121618; --panel:#1b2125; --ink:#e4e9ec; --muted:#9aa6af; --line:#2d373e;
  --accent:#ff7a3d; --accent-ink:#1d0b00; --steel:#a3b9ca; --steel-ink:#0f1519;
  --ok:#4fc482; --warn:#f0a843; --bad:#f2736b;
  --ok-bg:#15301f; --warn-bg:#33270f; --bad-bg:#3a1b19; --soft:#242c31;
  color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:14px 10px;flex-wrap:wrap}
header h1{font-size:20px;font-weight:700;margin:0;display:flex;align-items:center;gap:8px}
.logo{height:34px;width:auto;display:block;background:#ffffff;border-radius:7px;padding:5px 6px;box-shadow:0 0 0 1px var(--line)}
.mark{width:22px;height:22px;border-radius:4px;background:repeating-linear-gradient(-45deg,var(--accent) 0 5px,var(--steel) 5px 10px)}
.save{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
.save.on{background:var(--ok-bg);color:var(--ok)}.save.off{background:var(--bad-bg);color:var(--bad)}
.banner{border-radius:var(--r);padding:12px 14px;font-size:14px;margin-bottom:12px;background:var(--warn-bg);border:1px solid var(--warn)}
.banner.bad{background:var(--bad-bg);border-color:var(--bad)}
.banner b{display:block;margin-bottom:2px}
button{font-family:var(--f-body);font-size:16px;font-weight:600;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:12px 16px;cursor:pointer;line-height:1.2;min-height:48px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.dark{background:var(--steel);border-color:var(--steel);color:var(--steel-ink)}
button.danger{color:var(--bad);border-color:var(--bad)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);min-height:40px;padding:8px 10px}
button:disabled{opacity:.45;cursor:not-allowed}
.big{width:100%;font-size:18px;min-height:60px;padding:16px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1 1 140px}
.note{font-size:14px;color:var(--muted)}
h2{font-size:18px;font-weight:700;margin:0;text-wrap:balance}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{font-family:var(--f-body);font-size:16px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--ink);width:100%;min-width:0;min-height:48px}
textarea{min-height:70px;resize:vertical}
label.fld{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted);min-width:0}
.scan{display:flex;flex-direction:column;gap:10px}
.scan .field{display:flex;align-items:center;background:var(--panel);border:2px solid var(--steel);border-radius:var(--r);padding:0 12px}
.scan .field:focus-within{border-color:var(--accent)}
.scan input{border:0;font-family:var(--f-mono);font-size:20px;padding:16px 4px;background:transparent;outline:none;min-height:60px}
.scan.batch .field{border-style:dashed;border-color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;font-weight:400;display:flex;flex-direction:column;min-height:auto}
.tile .v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .l{font-size:14px;color:var(--muted)}
.tile .s{font-size:13px;font-weight:600;color:var(--bad)}
.tile.alert{border-color:var(--bad)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;font-weight:400;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-height:56px}
.item .c{font-family:var(--f-mono);font-weight:700;font-size:16px;white-space:nowrap}
.item .t{font-size:14px;color:var(--muted);text-align:right;min-width:0}
.item .t b{display:block;font-weight:600}
.item.bad{border-left:5px solid var(--bad)}.item.warn{border-left:5px solid var(--warn)}
.list{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{min-height:40px;padding:8px 14px;font-size:14px;border-radius:999px;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--steel);border-color:var(--steel);color:var(--steel-ink)}
.head{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.head .code{font-family:var(--f-mono);font-size:30px;font-weight:700;line-height:1.05;word-break:break-all}
.head .type{font-size:14px;color:var(--muted);margin-top:2px}
.head .qr{width:76px;height:76px;background:#ffffff;border-radius:6px;padding:2px}
.head .qr svg{width:100%;height:100%;display:block}
.status{grid-column:1/-1;font-size:20px;font-weight:700;padding:12px 14px;border-radius:8px;background:var(--soft)}
.status small{display:block;font-size:14px;font-weight:500;margin-top:2px}
.status.ok{background:var(--ok-bg);color:var(--ok)}.status.warn{background:var(--warn-bg);color:var(--warn)}.status.bad{background:var(--bad-bg);color:var(--bad)}
.status.gray{color:var(--muted)}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choices label{position:relative;display:flex;align-items:center;justify-content:center;text-align:center;min-height:56px;padding:8px;border:2px solid var(--line);border-radius:var(--r);font-weight:600;font-size:15px;cursor:pointer;background:var(--panel)}
.choices input{position:absolute;opacity:0;pointer-events:none}
.choices label.on{border-color:var(--accent);background:var(--soft)}
.check{display:flex;gap:12px;align-items:flex-start;font-size:15px;cursor:pointer;padding:6px 0}
.check input{width:24px;height:24px;margin:0;flex:none;accent-color:var(--accent)}
.check small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.check small.crit{color:var(--bad)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.hist li:last-child{border-bottom:0}
.hist .w{font-size:13px;color:var(--muted)}
.hist .d{font-size:14px;color:var(--muted)}
.demo{font-size:11px;font-weight:600;color:var(--warn);border:1px solid var(--warn);border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:3px;font-family:var(--f-body)}
.warnline{font-size:14px;color:var(--warn);font-weight:600;margin:0}
.menu{display:flex;flex-direction:column;gap:8px}
.menu button{text-align:left;display:flex;flex-direction:column;gap:2px;padding:14px 16px}
.menu button small{font-weight:400;font-size:14px;color:var(--muted)}
.back{margin-bottom:10px}
.confirm{border:1px solid var(--bad);background:var(--bad-bg);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.bottom div{display:flex;gap:6px;width:100%;max-width:640px}
nav.bottom button{flex:1;border:0;background:transparent;color:var(--muted);font-size:15px;min-height:52px;border-radius:8px}
nav.bottom button[aria-current="true"]{background:var(--soft);color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ok);color:#ffffff;padding:14px 18px;border-radius:var(--r);z-index:40;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:16px}
.toast.bad{background:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:4px 4px 4px 12px;font-size:15px}
.pill button{min-height:32px;padding:2px 10px;border-radius:999px;font-size:13px}
a{color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .15s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(4px)}}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span id="logoSlot"><span class="mark" aria-hidden="true"></span></span>Учёт тары</h1>
    <span class="save" id="save">подключение…</span>
  </header>
  <div id="banners"></div>
  <main id="view" class="view"></main>
</div>
<nav class="bottom"><div>
  <button data-nav="scan" aria-current="true">Сканер</button>
  <button data-nav="list" aria-current="false">Список</button>
  <button data-nav="more" aria-current="false">Ещё</button>
</div></nav>
<input id="photoInput" type="file" accept="image/*" capture="environment" hidden>
<div id="toastRoot"></div>

// POST без cookies и с text/plain — так запрос не требует входа в Google и работает в любом браузере
async function api(fn,...args){
  let r;
  try{
    r=await fetch(API_URL,{method:"POST",credentials:"omit",redirect:"follow",
      headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn,args})});
  }catch(e){throw new Error("нет связи с сервером")}
  let j; try{j=await r.json()}catch(e){throw new Error("сервер ответил не так, как ожидалось")}
  if(!j.ok) throw new Error(j.error||"ошибка сервера");
  return j.data;
}
async function load(){

    units=new Map(s.units.map(u=>[u.code,u]));events=s.events;cfg=s.cfg;role=s.role;APP_URL=(s.url&&!/script\.google\.com/.test(s.url))?s.url:(location.origin+location.pathname);SHEET_URL=s.sheetUrl;

}

const RU="йцукенгшщзхъфывапролджэячсмитьбюЙЦУКЕНГШЩЗХЪФЫВАПРОЛДЖЭЯЧСМИТЬБЮ№";
const EN="qwertyuiop[]asdfghjkl;'zxcvbnm,.QWERTYUIOP{}ASDFGHJKL:\"ZXCVBNM<>#";
function fixLayout(s){return [...s].map(ch=>{const i=RU.indexOf(ch);return i>=0?EN[i]:ch}).join("")}
function parseCode(raw){
  let s=String(raw||"").trim(); if(!s) return null;
  if(/[а-яё№]/i.test(s)) s=fixLayout(s);
  const q=s.match(/[?&#]c=([^&#\s]+)/i); if(q) s=q[1];
  else if(/^https?:/i.test(s)) return null;
  s=decodeURIComponent(s).toUpperCase();
  let m=s.match(/([A-Z]{1,4})[-_ ]?0*(\d{1,6})/);
  if(m) return m[1]+"-"+pad(+m[2]);
  m=s.match(/^0*(\d{1,6})$/);
  if(m&&cfg.types.length===1) return cfg.types[0].prefix+"-"+pad(+m[1]);
  return null;
}

/* ========== QR ========== */
function qrSvg(text){
  if(typeof qrcode!=="function") return `<svg viewBox="0 0 10 10"></svg>`;
  const q=qrcode(0,"M"); q.addData(text); q.make();
  const n=q.getModuleCount(); let d="";
  for(let r=0;r<n;r++)for(let c=0;c<n;c++) if(q.isDark(r,c)) d+=`M${c} ${r}h1v1h-1z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 ${n+4} ${n+4}" shape-rendering="crispEdges" role="img" aria-label="QR-код"><rect x="-2" y="-2" width="${n+4}" height="${n+4}" fill="#ffffff"/><path d="${d}" fill="#000000"/></svg>`;
}

/* ========== Правила (подсказки в интерфейсе; окончательную проверку делает сервер) ========== */
function flags(u){
  const f=[]; const now=Date.now();
  if(!u||u.loc==="scrapped") return f;
  if(u.loc==="client"&&u.ship&&u.ship.due&&u.ship.due<now) f.push({lvl:"bad",t:`Просрочен возврат на ${daysSince(u.ship.due)} дн.`});
  if(u.cond==="broken"&&u.loc!=="repair") f.push({lvl:"bad",t:"Неисправна — отправьте в ремонт"});
  if(u.cond==="dirty"&&u.loc!=="client") f.push({lvl:"warn",t:"Нужна мойка"});
  if(u.loc!=="client"&&cfg.toDays&&now-(u.lastTO||u.created||now)>cfg.toDays*DAY) f.push({lvl:"warn",t:"Пора делать плановое ТО"});
  return f;
}
function whyNot(u,act){
  if(!u) return "нет в учёте";
  if(u.loc==="scrapped"&&act!=="note") return "тара списана";
  switch(act){
    case "receive": return u.loc==="wh"?"уже на складе":null;
    case "line": return u.loc!=="wh"?"выдать можно только со склада":null;
    case "ship": return (u.loc==="wh"||u.loc==="line")?null:"сейчас: "+LOC[u.loc].toLowerCase();
    case "clean": return u.loc==="client"?"тара у клиента":(u.cond!=="dirty"?"не отмечена как грязная":null);
    case "torepair": return u.loc==="repair"?"уже в ремонте":(u.loc==="client"?"тара у клиента":null);
    case "repaired": return u.loc!=="repair"?"не в ремонте":null;
    case "to": case "inspect": return u.loc==="client"?"тара у клиента":null;
  }
  return null;
}
function softWarn(u,act){
  if((act==="line"||act==="ship")&&u.cond==="broken") return "Тара отмечена как неисправная";
  if((act==="line"||act==="ship")&&u.cond==="dirty") return "Тара не помыта";
  return "";
}

// QR векторными прямоугольниками — чёткий при любом размере печати
function pdfQr(doc,text,x,y,size){
  const q=qrcode(0,"M");q.addData(text);q.make();
  const n=q.getModuleCount(),c=size/(n+4);
  doc.setFillColor(0,0,0);
  for(let r=0;r<n;r++){let run=-1;
    for(let k=0;k<=n;k++){const dark=k<n&&q.isDark(r,k);
      if(dark&&run<0)run=k;
      if(!dark&&run>=0){doc.rect(x+(run+2)*c,y+(r+2)*c,(k-run)*c+0.02,c+0.02,"F");run=-1}}}
}
// Текстовая часть этикетки рисуется картинкой — так кириллица печатается без встраивания шрифтов
function labelText(code,type,w,h,logo){
  const S=12,W=Math.round(w*S),H=Math.round(h*S),cv=document.createElement("canvas");cv.width=W;cv.height=H;
  const x=cv.getContext("2d");x.fillStyle="#ffffff";x.fillRect(0,0,W,H);x.fillStyle="#111111";x.textBaseline="top";
  let fs=H*0.2;x.font=`700 ${fs}px "JetBrains Mono",monospace`;while(x.measureText(code).width>W&&fs>8){fs-=1;x.font=`700 ${fs}px "JetBrains Mono",monospace`}
  x.fillText(code,0,0);
  let y=fs*1.25,ts=H*0.085;x.font=`500 ${ts}px "Golos Text",Arial,sans-serif`;
  const words=String(type).split(" ");let line="",lines=[];
  for(const wd of words){const t=line?line+" "+wd:wd;if(x.measureText(t).width>W&&line){lines.push(line);line=wd}else line=t}
  if(line)lines.push(line);
  lines.slice(0,2).forEach(l=>{x.fillText(l,0,y);y+=ts*1.2});
  const ns=H*0.07;x.font=`500 ${ns}px "Golos Text",Arial,sans-serif`;x.fillStyle="#333333";
  x.fillText("Собственность. Подлежит возврату",0,H-ns*1.15,W);

async function labelsPdf(codes,fmt,btn){
  if(!codes.length){toast("В этом диапазоне нет тары",1);return}
  if(!window.jspdf||typeof qrcode!=="function"){toast("Модуль PDF не загрузился — обновите страницу",1);return}
  const old=btn?btn.textContent:"";if(btn){btn.disabled=true;btn.textContent="Готовлю PDF…"}
  try{
    if(document.fonts&&document.fonts.ready) await document.fonts.ready;
    const logo=await loadImg(LOGO_FULL);
    const {jsPDF}=window.jspdf;
    const F={t58:{w:58,h:40,q:26,qx:2,qy:7,tx:30,ty:3,tw:26,th:34},
             t100:{w:100,h:70,q:56,qx:3,qy:7,tx:62,ty:6,tw:35,th:58},
             a4:{w:70,h:42.4,q:30,qx:3,qy:6.2,tx:35,ty:3,tw:32,th:36.4}}[fmt];
    const doc=fmt==="a4"?new jsPDF({unit:"mm",format:"a4"}):new jsPDF({unit:"mm",format:[F.w,F.h],orientation:"l"});
    for(let i=0;i<codes.length;i++){
      let ox=0,oy=0;
      if(fmt==="a4"){const k=i%21;if(k===0&&i>0)doc.addPage();ox=(k%3)*70;oy=0.6+Math.floor(k/3)*42.4}
      else if(i>0) doc.addPage([F.w,F.h],"l");
      const code=codes[i],u=units.get(code)||{};
      pdfQr(doc,qrText(code),ox+F.qx,oy+F.qy,F.q);
      doc.addImage(labelText(code,typeName(u.type),F.tw,F.th,logo),"PNG",ox+F.tx,oy+F.ty,F.tw,F.th,undefined,"FAST");
      if(i%20===19){if(btn)btn.textContent=`Готовлю PDF… ${i+1} из ${codes.length}`;await new Promise(r=>setTimeout(r,0))}
    }
    saveFile(`Этикетки ${codes[0]}-${codes[codes.length-1]}.pdf`,doc.output("blob"));
    toast(`PDF готов: ${codes.length} шт.`);
  }catch(e){toast("Не удалось сделать PDF: "+(e.message||e),1)}
  if(btn){btn.disabled=false;btn.textContent=old}
}

    const cv=document.createElement("canvas");cv.width=w;cv.height=h;const cx=cv.getContext("2d");cx.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);

/* ТСД в режиме клавиатуры: символы, набранные вне полей ввода, собираются в буфер; Enter — открыть карточку */
let kbuf="",ktimer=0;
document.addEventListener("keydown",e=>{
  const t=e.target;if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.tagName==="SELECT"||t.isContentEditable))return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==="Enter"&&kbuf){e.preventDefault();const v=kbuf;kbuf="";handleScan(v);return}
  if(e.key.length===1){kbuf+=e.key;clearTimeout(ktimer);ktimer=setTimeout(()=>kbuf="",800);e.preventDefault()}
});

  const lb=e.target.closest("[data-label]");if(lb){labelsPdf([lb.dataset.label],"t58",lb);return}
  const br=e.target.closest("[data-brm]");if(br){batch.rows=batch.rows.filter(r=>r.code!==br.dataset.brm);updateBatch();return}
  const rc=e.target.closest("[data-rmclient]");if(rc){rc.disabled=true;api("removeClient",rc.dataset.rmclient,myPin()).then(load).then(()=>view==="settings"&&renderSettings()).catch(er=>toast("Не удалено: "+er.message,1));return}
});
